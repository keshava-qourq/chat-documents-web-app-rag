services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
  minio:
    image: bitnamilegacy/minio:2024.10.13
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: app
      MINIO_ROOT_PASSWORD: change-me-minio
    volumes:
      - minio-data:/bitnami/minio/data
    restart: unless-stopped
volumes:
  db-data:
  minio-data:
